<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конный клуб — расписание</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#2d2a26;--muted:#8a8478;--green:#4a7c59;--green-dark:#3a6247;--line:#e5e0d5;--red:#c0533e;--yellow:#e0b73f;--yellow-dark:#c2952c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:14px;padding-bottom:90px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
  header h1{font-size:19px;flex:1;min-width:160px}
  .msk{font-size:12px;font-weight:700;color:var(--muted);background:var(--card);border:1.5px solid var(--line);padding:4px 10px;border-radius:20px;white-space:nowrap}
  .status{font-size:12px;padding:4px 10px;border-radius:20px;background:#eee;color:#777;white-space:nowrap}
  .status.ok{background:#e2f3e5;color:#2e7d43}
  .status.err{background:#fbe4e0;color:var(--red)}
  .adminbtn{font-size:12px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
  .adminbtn.on{background:#3f3a33;border-color:#3f3a33;color:#fff}
  .adminbtn.out{background:#fdf6f4;border-color:#e8c9c0;color:var(--red)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-bottom:8px}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .dot-done{background:var(--green)}.dot-wait{background:var(--yellow)}.dot-cancel{background:var(--red)}
  .month-label{font-size:14px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:8px}
  .days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .day-tab{flex:0 0 auto;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;min-width:64px}
  .day-tab .dname{display:block;font-size:11px}.day-tab .dnum{display:block;font-size:16px;font-weight:800;margin-top:2px;line-height:1.2}
  .day-tab .cnt{display:inline-block;margin-top:2px;font-size:10px;background:var(--line);color:var(--ink);border-radius:8px;padding:1px 6px}
  .day-tab.today{border-color:var(--green);color:var(--green-dark)}
  .day-tab.active{background:var(--green);border-color:var(--green);color:#fff}
  .day-tab.active .cnt{background:rgba(255,255,255,.25);color:#fff}
  .day-tab.new-month .dname,.day-tab.new-month .dnum{color:var(--muted);font-size:12px}
  .day-tab.active.new-month .dname,.day-tab.active.new-month .dnum{color:#fff;font-size:13px}
  .grid-wrap{overflow-x:auto;margin-top:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
  .grid{display:grid;min-width:600px}
  .gh{position:sticky;top:0;z-index:5;background:#f0ece3;font-size:12px;font-weight:700;color:var(--muted);padding:10px 6px;text-align:center;border-bottom:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;min-height:42px}
  .gh.corner{background:#e8e3d8;font-size:11px}
  .gl{position:sticky;left:0;z-index:4;background:#f7f5f0;font-size:13px;font-weight:700;padding:8px 10px;border-right:1.5px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;white-space:nowrap;min-height:52px}
  .gc{padding:4px;border-bottom:1px solid #f0ece3;border-right:1px solid #f0ece3;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px}
  .gc.empty-slot{background:#fafaf7}
  .gc .btime{font-size:10px;color:var(--muted);line-height:1.2}
  .gc .btrainer{font-size:10px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
  .gc .bprice{font-size:10px;color:var(--green-dark);font-weight:700;margin-top:1px}
  .gc .bblock{width:100%;padding:3px 4px;border-radius:6px;text-align:center;cursor:pointer;margin-bottom:2px;border-left:3px solid transparent;transition:transform .1s}
  .gc .bblock:active{transform:scale(.96)}
  .gc .bblock.s-wait{background:#fdf6e0}.gc .bblock.s-done{background:#e8f5ea}.gc .bblock.s-cancel{background:#fdeae6;opacity:.6}.gc .bblock.past{opacity:.45}
  .gc .add-placeholder{width:100%;height:100%;min-height:44px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:18px;cursor:pointer;border-radius:6px}
  .gc .add-placeholder:hover{background:#eef4ec;color:var(--green)}
  .fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;display:none}
  .overlay{position:fixed;inset:0;background:rgba(30,25,15,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .overlay.open{display:flex}
  .modal{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px}
  @media(min-width:600px){.overlay{align-items:center}.modal{border-radius:18px}}
  .modal h2{font-size:17px;margin-bottom:8px}
  .modal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px}
  .modal select,.modal input[type="text"],.modal input[type="number"],.modal input[type="password"],.modal textarea{width:100%;padding:11px 12px;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:#fbfaf7;color:var(--ink);font-family:inherit}
  .modal textarea{resize:vertical;min-height:50px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fbfaf7;font-size:14px;font-weight:600;cursor:pointer}
  .chip.sel{background:var(--green);border-color:var(--green);color:#fff}
  .pricebox{margin-top:16px;padding:12px;border-radius:10px;background:#eef4ec;border:1.5px solid #d3e2d4;display:flex;justify-content:space-between;align-items:center}
  .pricebox .lbl{font-size:12px;color:var(--muted)}.pricebox .hint{font-size:11px;color:var(--muted);margin-top:3px}
  .pricebox .sum{font-size:20px;font-weight:800;color:var(--green-dark)}
  .btnrow{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.save{background:var(--green);color:#fff}.btn.cancel{background:#efece4;color:var(--muted)}
  .err{color:var(--red);font-size:13px;margin-top:10px;display:none}
  .sec{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
  .sec h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .namechip{display:inline-flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfaf7;font-size:14px;font-weight:600;margin:0 6px 6px 0}
  .namechip .rm{border:none;background:#f7e9e6;color:var(--red);width:22px;height:22px;border-radius:7px;font-size:12px;cursor:pointer}
  .addrow{display:flex;gap:8px;margin-top:6px;align-items:center}
  .addrow input{flex:1}
  .addrow button{padding:0 16px;border:none;border-radius:10px;background:var(--green);color:#fff;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
  .muted{color:var(--muted);font-size:12px;margin-top:6px}
  .detail-card{padding:14px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:12px}
  .detail-card .dc-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
  .detail-card .dc-label{color:var(--muted);font-size:12px}.detail-card .dc-val{font-weight:600}
  .detail-card .dc-price{font-size:22px;font-weight:800;color:var(--green-dark);text-align:right;margin-top:6px}
  .detail-card .dc-status{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700;margin-top:6px}
  .dc-done{background:#e2f3e5;color:#2e7d43}.dc-wait{background:#fbf0d2;color:#9a7b16}.dc-cancel{background:#fbe4e0;color:var(--red)}
  .dc-del{margin-top:10px;width:100%;padding:10px;border:1.5px solid var(--red);border-radius:10px;background:#fdf4f2;color:var(--red);font-size:14px;font-weight:700;cursor:pointer}
  .dc-order-status{margin-top:8px;padding:8px;background:#f9f7f2;border-radius:8px;font-size:13px;color:var(--ink);font-style:italic}
  .db-stats{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
  .db-stats span{font-weight:700;color:var(--ink)}
  .watch-panel{padding:20px;max-width:600px;margin:20px auto;background:var(--card);border-radius:16px;border:1.5px solid var(--line)}
  .watch-panel h2{margin-bottom:16px;text-align:center}
  .wp-online{background:#eef4ec;padding:12px;border-radius:10px;margin-bottom:16px;text-align:center}
  .wp-online .num{font-size:32px;font-weight:800;color:var(--green-dark)}
  .wp-logs{max-height:400px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:#fdfcfa}
  .wp-log{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .wp-log .time{color:var(--muted);font-size:11px;display:block;margin-bottom:2px}
  .wp-log .act{color:var(--red)}.wp-log .act.done{color:var(--green)}
  
  /* Настройки */
  .cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .cfg-row input{margin:0}
  .cfg-block{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fdfcfa}
  .cfg-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .cfg-top input{flex:1;margin:0}
  .cfg-top .rm{border:none;background:#f7e9e6;color:var(--red);width:30px;height:30px;border-radius:8px;font-size:12px;cursor:pointer;flex-shrink:0}
  .price-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));gap:6px}
  .price-item{display:flex;flex-direction:column;gap:2px}
  .price-item span{font-size:11px;color:var(--muted);text-align:center}
  .price-item input{text-align:center;padding:8px 4px !important;font-size:13px !important}
  .color-strip{width:100%;height:10px;border-radius:5px;cursor:pointer;border:1px solid var(--line);margin-top:4px}
  input[type="color"]{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
</style>
</head>
<body>

<header>
  <h1>🐴 Расписание</h1>
  <div class="msk" id="mskClock">🕐 МСК --:--:--</div>
  <div class="status" id="status">подключение…</div>
  <button class="adminbtn" id="adminBtn" style="display:none">🔒 Войти</button>
  <button class="adminbtn on" id="adminCfgBtn" style="display:none">⚙️ Настройки</button>
  <button class="adminbtn out" id="adminOutBtn" style="display:none">🚪 Выход</button>
</header>

<div id="mainUI">
  <div class="legend"><span><i class="dot dot-done"></i>Выполнено</span><span><i class="dot dot-wait"></i>Ожидание</span><span><i class="dot dot-cancel"></i>Отменена</span></div>
  <div class="month-label" id="monthLabel"></div>
  <div class="days" id="days"></div>
  <div id="sched"></div>
  <div class="guesthint" id="guestHint" style="display:none">Вход — «🔒 Войти»</div>
  <div class="db-stats" id="dbStats"></div>
</div>

<div id="watchUI" style="display:none">
  <div class="watch-panel">
    <h2>👁️ Панель наблюдателя</h2>
    <div class="wp-online">Онлайн на сайте: <div class="num" id="wpOnlineNum">0</div></div>
    <div class="wp-logs" id="wpLogs"></div>
  </div>
</div>

<button class="fab" id="fab">＋</button>

<div class="overlay" id="loginOverlay"><div class="modal">
  <h2>🔐 Вход</h2>
  <label>Логин</label><input type="text" id="loginUser" value="admin">
  <label>Пароль</label><input type="password" id="loginPass">
  <div class="err" id="loginErr"></div>
  <div class="btnrow"><button class="btn cancel" id="loginCancel">Отмена</button><button class="btn save" id="loginGo">Войти</button></div>
</div></div>

<div class="overlay" id="cfgOverlay"><div class="modal" id="cfgModal"></div></div>
<div class="overlay" id="detailOverlay"><div class="modal" id="detailModal"></div></div>
<div class="overlay" id="overlay"><div class="modal" id="formModal"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
'use strict';
const firebaseConfig = {
  apiKey: "AIzaSyB9IaJLOmpUUezSpI6Ie41P1OB2cWanUuY",
  authDomain: "courage-club-46edd.firebaseapp.com",
  databaseURL: "https://courage-club-46edd-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "courage-club-46edd",
  storageBucket: "courage-club-46edd.firebasestorage.app",
  messagingSenderId: "479863326444",
  appId: "1:479863326444:web:5dd3edfb9594e74af5c7c9",
  measurementId: "G-G1KHG5Z1WR"
};

function moscowNow(){return new Date(Date.now()+(new Date().getTimezoneOffset()+180)*60000)}
function mskClockStr(){const d=moscowNow();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}
function getDateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function generateDates(){const m=moscowNow(),d=[];for(let i=0;i<14;i++)d.push(new Date(m.getFullYear(),m.getMonth(),m.getDate()+i));return d}
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DAYS_SHORT=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const STATUSES={done:{label:'Выполнено',cls:'done',icon:'✓'},wait:{label:'Ожидание',cls:'wait',icon:'⏳'},cancel:{label:'Отменена',cls:'cancel',icon:'🚫'}};
const DEFAULT_CONFIG = {
  rate: 800,
  loads: [{label:'Плац',durs:'0.5, 1, 1.5, 2, 3',prices:{0.5:1500,1:2500,1.5:3500,2:4500,3:6500}},{label:'Поле',durs:'1, 1.5, 2',prices:{1:1000,1.5:1500,2:2000}},{label:'Лес',durs:'1.5, 2, 3',prices:{1.5:2250,2:3000,3:4500}}],
  tempos: [{label:'Шаг'},{label:'Рысь'},{label:'Галоп'}],
  horses: ['Рокки','Изюм','Форсаж'],
  trainers: [{name:'Анна Соколова',color:'#e91e63'},{name:'Игорь Волков',color:'#2196f3'}],
  adminPass: 'admin', watcherPass: 'admin123', tgToken: '', tgChat: ''
};

let db=null, config=JSON.parse(JSON.stringify(DEFAULT_CONFIG)), bookings=[], logs=[];
let role=localStorage.getItem('hc_role')||'guest';
let dates=generateDates(), curDateOffset=0, curDur=1.5, curLoadIdx=0, curTempoIdx=0, curStatus='wait';
let lastMskDateStr='', editingId=null, dbSizeBytes=0;

const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const minToStr=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatBytes(b){if(b<1024)return b+' Б';if(b<1048576)return(b/1024).toFixed(1)+' КБ';return(b/1048576).toFixed(2)+' МБ'}
function getLoadDurs(l){if(!l.durs)return[0.5,1,1.5,2,2.5,3];return l.durs.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n)&&n>0).sort((a,b)=>a-b)}
function getTimeSlots(){const s=[];for(let m=(config.startHour||8)*60;m<(config.endHour||21)*60;m+=(config.slotStep||30))s.push(m);return s}
function getTrainerColor(n){if(!n)return'transparent';const t=config.trainers.find(x=>x.name===n);return t?t.color:'transparent'}
function getLoadPricePerHour(l,d){if(!l||!l.prices)return config.rate;if(l.prices[d]&&l.prices[d]>0)return l.prices[d]/d;return config.rate}
function calcPrice(){return getLoadPricePerHour(config.loads[curLoadIdx],curDur)*curDur}
function refreshPrice(){document.getElementById('pSum').textContent=fmt(calcPrice());document.getElementById('pHint').textContent=curDur+' ч × '+fmt(getLoadPricePerHour(config.loads[curLoadIdx],curDur))+'/ч'}

function sendTg(t){if(!config.tgToken||!config.tgChat)return;fetch('https://api.telegram.org/bot'+config.tgToken+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:config.tgChat,text:t,parse_mode:'HTML'})}).catch(()=>{})}
function addLog(a,d){if(db)db.ref('logs').push({time:new Date().toISOString(),action:a,details:d})}
function setupPresence(){if(!db)return;const id=Date.now()+'_'+Math.random().toString(36).substr(2,9);db.ref('presence/'+id).set(true);db.ref('presence/'+id).onDisconnect().remove()}

function initFirebase(){
  const st=document.getElementById('status');
  if(!firebaseConfig||typeof firebase==='undefined'){st.textContent='демо';refreshUI();return}
  try{
    firebase.initializeApp(firebaseConfig);db=firebase.database();setupPresence();
    db.ref('config').on('value',snap=>{
      const v=snap.val();
      if(v){
        config=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)),v);
        if(!Array.isArray(config.loads))config.loads=DEFAULT_CONFIG.loads;
        if(!Array.isArray(config.tempos))config.tempos=DEFAULT_CONFIG.tempos;
        if(!Array.isArray(config.horses))config.horses=[];
        if(!Array.isArray(config.trainers))config.trainers=[];
        config.trainers=config.trainers.map(t=>typeof t==='string'?{name:t,color:'#4a7c59'}:t);
        config.loads.forEach(l=>{if(!l.prices)l.prices={};if(!l.durs)l.durs='0.5, 1, 1.5, 2, 2.5, 3';delete l.mult;delete l.price});
        config.tempos.forEach(t=>{delete t.mult;delete t.price});
      }
      curLoadIdx=Math.min(curLoadIdx,config.loads.length-1);curTempoIdx=Math.min(curTempoIdx,config.tempos.length-1);refreshUI();
    });
    db.ref('bookings').on('value',snap=>{
      const v=snap.val();bookings=v?Object.keys(v).map(k=>Object.assign({id:k},v[k])):[];
      try{dbSizeBytes=new Blob([JSON.stringify(v)]).size}catch(e){dbSizeBytes=0}
      refreshUI();st.textContent='● онлайн';st.className='status ok';
    },err=>{st.textContent='ошибка';st.className='status err'});
    db.ref('logs').orderByChild('time').limitToLast(50).on('value',snap=>{const v=snap.val();logs=v?Object.values(v).sort((a,b)=>b.time.localeCompare(a.time)):[];if(role==='watcher')renderWatchPanel()});
    db.ref('presence').on('value',snap=>{const v=snap.val();const el=document.getElementById('wpOnlineNum');if(el)el.textContent=v?Object.keys(v).length:0});
  }catch(e){st.textContent='ошибка';st.className='status err';db=null;refreshUI()}
}

function saveConfig(){if(db)db.ref('config').set(config);refreshUI()}
function saveBookingToCloud(item){
  if(db)db.ref('bookings').push(item);else{item.id='local_'+Date.now();bookings.push(item);refreshUI()}
  addLog('CREATE',item.horse+' '+minToStr(item.startMin)+' '+item.trainer);sendTg('✅ <b>Новая бронь</b>\n'+item.dateKey+'\n'+item.horse+' в '+minToStr(item.startMin)+'\nТренер: '+item.trainer+'\n'+fmt(item.price))
}
function updateBooking(id,data){
  if(db)db.ref('bookings/'+id).update(data);else{const b=bookings.find(x=>x.id===id);if(b)Object.assign(b,data);refreshUI()}
  if(data.status){const b=bookings.find(x=>x.id===id)||{};addLog('STATUS',b.horse+' -> '+data.status);sendTg('🔄 <b>Статус</b>\n'+data.status.toUpperCase()+'\n'+b.horse)}
}
function deleteBooking(id){
  const b=bookings.find(x=>x.id===id);
  if(db)db.ref('bookings/'+id).remove();else{bookings=bookings.filter(x=>x.id!==id);refreshUI()}
  if(b){addLog('DELETE',b.horse+' '+minToStr(b.startMin));sendTg('🗑 <b>Удалено</b>\n'+b.horse+' в '+minToStr(b.startMin))}
}

function renderDays(){
  const box=document.getElementById('days');box.innerHTML='';const tk=getDateKey(moscowNow()),fd=dates[0],ld=dates[13];
  document.getElementById('monthLabel').textContent=fd.getDate()+' – '+ld.getDate()+' '+MONTHS[ld.getMonth()]+' '+ld.getFullYear();
  dates.forEach((d,i)=>{const dk=getDateKey(d),n=bookings.filter(b=>b.dateKey===dk&&(b.status||'wait')!=='cancel').length;const t=document.createElement('div');
  t.className='day-tab'+(i===curDateOffset?' active':'')+(dk===tk?' today':'')+(d.getMonth()!==fd.getMonth()?' new-month':'');
  t.innerHTML='<span class="dname">'+DAYS_SHORT[d.getDay()]+'</span><span class="dnum">'+d.getDate()+'</span><span class="cnt">'+n+'</span>';

function renderSched(){
  const box=document.getElementById('sched'),horses=config.horses;
  if(!horses.length){box.innerHTML='<div style="color:#999;text-align:center;padding:40px">Нет лошадей.</div>';return}
  const ad=dates[curDateOffset],ak=getDateKey(ad),db2=bookings.filter(b=>b.dateKey===ak);
  const isT=ak===getDateKey(moscowNow()),nm=moscowNow().getHours()*60+moscowNow().getMinutes(),step=config.slotStep||30,slots=getTimeSlots();
  const grid=document.createElement('div');grid.className='grid';grid.style.gridTemplateColumns='72px repeat('+horses.length+', 1fr)';
  const c=document.createElement('div');c.className='gh corner';c.textContent='Время';grid.appendChild(c);
  horses.forEach(h=>{const g=document.createElement('div');g.className='gh';g.textContent=h;grid.appendChild(g)});
  slots.forEach(sm=>{
    const tc=document.createElement('div');tc.className='gl';tc.textContent=minToStr(sm);grid.appendChild(tc);
    horses.forEach(horse=>{
      const gc=document.createElement('div');gc.className='gc';
      const m=db2.filter(b=>b.horse===horse&&b.startMin<sm+step&&(b.startMin+b.dur*60)>sm);
      if(!m.length){gc.classList.add('empty-slot');if(role==='admin'){const p=document.createElement('div');p.className='add-placeholder';p.textContent='＋';p.onclick=()=>openFormFor(curDateOffset,sm,horse);gc.appendChild(p)}}
      else m.forEach(b=>{
        const s=STATUSES[b.status]||STATUSES.wait,p=isT&&(b.startMin+b.dur*60)<=nm,col=getTrainerColor(b.trainer);
        const bl=document.createElement('div');bl.className='bblock s-'+s.cls+(p?' past':'');
        if(col!=='transparent')bl.style.borderLeftColor=col;
        bl.innerHTML='<div class="btime">'+minToStr(b.startMin)+'-'+minToStr(b.startMin+b.dur*60)+'</div><div class="btrainer" style="color:'+(col!=='transparent'?col:'inherit')+'">'+esc(b.trainer||'—')+'</div><div class="bprice">'+fmt(b.price)+'</div>';
        bl.onclick=()=>openDetail(b.id);gc.appendChild(bl)
      });
      grid.appendChild(gc)
    })
  });
  const w=document.createElement('div');w.className='grid-wrap';w.appendChild(grid);box.innerHTML='';box.appendChild(w)
}

function _fillForm(off,sm,horse,dur,trainer,li,ti,status,os){
  const d=dates[off];document.getElementById('fDayInfo').textContent=d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+', '+DAYS_SHORT[d.getDay()];
  const ts=document.getElementById('fTime');ts.innerHTML='';getTimeSlots().forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=minToStr(m);if(m===sm)o.selected=true;ts.appendChild(o)});
  document.getElementById('fHorse').innerHTML=config.horses.map(h=>'<option'+(h===horse?' selected':'')+'>'+esc(h)+'</option>').join('')||'<option>—</option>';
  document.getElementById('trainerList').innerHTML=config.trainers.map(t=>'<option value="'+esc(t.name)+'">').join('');
  const ad=getLoadDurs(config.loads[li]),db=document.getElementById('fDur');db.innerHTML='';if(!ad.includes(dur))dur=ad[0]||1;
  ad.forEach(h=>{db.innerHTML+='<div class="chip'+(h===dur?' sel':'')+'" data-h="'+h+'">'+(h<1?(h*60)+' мин':h+' ч')+'</div>'});
  document.getElementById('fLoad').innerHTML=config.loads.map((l,i)=>'<div class="chip'+(i===li?' sel':'')+'" data-i="'+i+'">'+esc(l.label)+'</div>').join('');

  h += '<button id="cfgTrainerAdd">＋ Добавить</button></div></div>';

function renderCfgLists(){
  if(!cfgDraft) return;
  
  // Нагрузки
  const lBox = document.getElementById('cfgLoadsBox'); lBox.innerHTML = '';
  cfgDraft.loads.forEach((it, i) => {
    let block = '<div class="cfg-block">';
    block += '<div class="cfg-top"><input type="text" value="'+esc(it.label)+'" placeholder="Название" data-load-name="'+i+'"><button class="rm" data-rm-load="'+i+'">✕</button></div>';
    block += '<input type="text" value="'+esc(it.durs)+'" placeholder="0.5, 1, 2" data-load-durs="'+i+'" style="margin-bottom:8px">';
    block += '<div class="price-grid">';
    getLoadDurs(it).forEach(dur => {
      const label = dur < 1 ? (dur*60)+' мин' : dur+' ч';
      block += '<div class="price-item"><span>'+label+'</span><input type="number" step="50" min="0" value="'+(it.prices[dur]||0)+'" data-load-price="'+i+'_'+dur+'" placeholder="₽"></div>';
    });
    block += '</div></div>';
    lBox.innerHTML += block;
  });
  
  // Темпы
  const tBox = document.getElementById('cfgTemposBox'); tBox.innerHTML = '';
  cfgDraft.tempos.forEach((it, i) => {
    tBox.innerHTML += '<div class="cfg-row"><input type="text" value="'+esc(it.label)+'" placeholder="Темп" data-tempo-name="'+i+'"><button class="rm" data-rm-tempo="'+i+'">✕</button></div>';
  });
  
  // Лошади
  const hBox = document.getElementById('cfgHorsesBox'); hBox.innerHTML = '';
  cfgDraft.horses.forEach((it, i) => {
    hBox.innerHTML += '<span class="namechip">'+esc(it)+' <button class="rm" data-rm-horse="'+i+'">✕</button></span>';
  });
  
  // Тренеры
  const trBox = document.getElementById('cfgTrainersBox'); trBox.innerHTML = '';
  cfgDraft.trainers.forEach((it, i) => {
    trBox.innerHTML += '<div class="cfg-block" style="padding:8px"><div style="display:flex;align-items:center;gap:8px"><span style="flex:1;font-weight:600;font-size:14px">'+esc(it.name)+'</span><button class="rm" data-rm-trainer="'+i+'">✕</button></div><div class="color-strip" style="background:'+it.color+'" data-color-strip="'+i+'"></div><input type="color" value="'+it.color+'" data-color-input="'+i+'"></div>';
  });
}

function bindCfgEvents(){
  if(!cfgDraft) return;
  
  // Живое обновление нагрузок (без перерисовки всего модалки)
  document.querySelectorAll('[data-load-name]').forEach(el => {
    el.oninput = function(){ cfgDraft.loads[this.dataset.loadName].label = this.value; }
  });
  document.querySelectorAll('[data-load-durs]').forEach(el => {
    el.oninput = function(){
      cfgDraft.loads[this.dataset.loadDurs].durs = this.value;
      // Перерисовываем только цены для этой нагрузки
      const i = this.dataset.loadDurs;
      const grid = this.nextElementSibling;
      grid.innerHTML = '';
      getLoadDurs(cfgDraft.loads[i]).forEach(dur => {
        const label = dur < 1 ? (dur*60)+' мин' : dur+' ч';
        grid.innerHTML += '<div class="price-item"><span>'+label+'</span><input type="number" step="50" min="0" value="'+(cfgDraft.loads[i].prices[dur]||0)+'" data-load-price="'+i+'_'+dur+'" placeholder="₽"></div>';
      });
      bindCfgEvents(); // Ребинд для новых инпутов цен
    }
  });
  document.querySelectorAll('[data-load-price]').forEach(el => {
    el.oninput = function(){
      const [i, dur] = this.dataset.loadPrice.split('_');
      if(!cfgDraft.loads[i].prices) cfgDraft.loads[i].prices = {};
      cfgDraft.loads[i].prices[parseFloat(dur)] = parseFloat(this.value) || 0;
    }
  });
  document.querySelectorAll('[data-rm-load]').forEach(el => {
    el.onclick = function(){ if(cfgDraft.loads.length<=1) return; cfgDraft.loads.splice(this.dataset.rmLoad, 1); renderCfgLists(); bindCfgEvents(); }
  });
  
  document.querySelectorAll('[data-tempo-name]').forEach(el => {
    el.oninput = function(){ cfgDraft.tempos[this.dataset.tempoName].label = this.value; }
  });
  document.querySelectorAll('[data-rm-tempo]').forEach(el => {
    el.onclick = function(){ if(cfgDraft.tempos.length<=1) return; cfgDraft.tempos.splice(this.dataset.rmTempo, 1); renderCfgLists(); bindCfgEvents(); }
  });
  document.querySelectorAll('[data-rm-horse]').forEach(el => {
    el.onclick = function(){ cfgDraft.horses.splice(this.dataset.rmHorse, 1); renderCfgLists(); bindCfgEvents(); }
  });
  document.querySelectorAll('[data-rm-trainer]').forEach(el => {
    el.onclick = function(){ cfgDraft.trainers.splice(this.dataset.rmTrainer, 1); renderCfgLists(); bindCfgEvents(); }
  });
  
  // Цвета тренеров
  document.querySelectorAll('[data-color-strip]').forEach(el => {
    el.onclick = function(){ this.nextElementSibling.click(); }
  });
  document.querySelectorAll('[data-color-input]').forEach(el => {
    el.oninput = function(){
      const i = this.dataset.colorInput;
      cfgDraft.trainers[i].color = this.value;
      this.previousElementSibling.style.background = this.value;
    }
  });
  
  // Кнопки добавления
  document.getElementById('cfgLoadAdd').onclick = function(){
    const n = document.getElementById('cfgLoadName').value.trim(); if(!n) return;
    cfgDraft.loads.push({label:n, durs:'1, 1.5, 2', prices:{1:0, 1.5:0, 2:0}});
    document.getElementById('cfgLoadName').value=''; renderCfgLists(); bindCfgEvents();
  };
  document.getElementById('cfgTempoAdd').onclick = function(){
    const n = document.getElementById('cfgTempoName').value.trim(); if(!n) return;
    cfgDraft.tempos.push({label:n}); document.getElementById('cfgTempoName').value=''; renderCfgLists(); bindCfgEvents();
  };
  document.getElementById('cfgHorseAdd').onclick = function(){
    const n = document.getElementById('cfgHorseName').value.trim(); if(!n) return;
    cfgDraft.horses.push(n); document.getElementById('cfgHorseName').value=''; renderCfgLists(); bindCfgEvents();
  };
  document.getElementById('cfgTrainerAdd').onclick = function(){
    const n = document.getElementById('cfgTrainerName').value.trim(), c = document.getElementById('cfgTrainerColor').value;
    if(!n) return;
    cfgDraft.trainers.push({name:n, color:c}); document.getElementById('cfgTrainerName').value=''; renderCfgLists(); bindCfgEvents();
  };
  
  // Кнопки закрытия и сохранения
  document.getElementById('cfgCancelBtn').onclick = closeCfg;
  document.getElementById('cfgSaveBtn').onclick = function(){
    const err = document.getElementById('cfgErr');
    const rate = parseFloat(document.getElementById('cfgRate').value);
    if(isNaN(rate)||rate<0){err.textContent='⚠ Укажите ставку.';err.style.display='block';return}
    
    cfgDraft.rate = rate;
    cfgDraft.loads = cfgDraft.loads.filter(l=>l.label&&l.label.trim()).map(l=>{
      const p={}; getLoadDurs(l).forEach(k=>{p[k]=l.prices?l.prices[k]||0:0}); return{label:l.label.trim(), durs:l.durs, prices:p}
    });
    cfgDraft.tempos = cfgDraft.tempos.filter(t=>t.label&&t.label.trim()).map(t=>({label:t.label.trim()}));
    if(!cfgDraft.loads.length||!cfgDraft.tempos.length){err.textContent='⚠ Добавьте варианты.';err.style.display='block';return}
    cfgDraft.horses = cfgDraft.horses.map(h=>h.trim()).filter(Boolean);
    cfgDraft.trainers = cfgDraft.trainers.map(t=>typeof t==='string'?{name:t.trim(),color:'#4a7c59'}:{name:t.name.trim(),color:t.color||'#4a7c59'}).filter(t=>t.name);
    cfgDraft.watcherPass = document.getElementById('cfgWPass').value.trim() || 'admin123';
    cfgDraft.tgToken = document.getElementById('cfgTgToken').value.trim();
    cfgDraft.tgChat = document.getElementById('cfgTgChat').value.trim();
    
    config = JSON.parse(JSON.stringify(cfgDraft));
    curLoadIdx=0; curTempoIdx=0;
    saveConfig(); closeCfg();
  };
}

// Остальные кликеры
document.getElementById('fCancel').addEventListener('click',closeForm);
document.getElementById('fab').addEventListener('click',()=>{if(role==='admin')openForm()});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeForm()});
document.getElementById('cfgOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeCfg()});
document.getElementById('loginOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)document.getElementById('loginOverlay').classList.remove('open')});
document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail()});

function startMskClock(){
  const tick=()=>{document.getElementById('mskClock').textContent='🕐 МСК '+mskClockStr();const cd=getDateKey(moscowNow());if(cd!==lastMskDateStr){lastMskDateStr=cd;dates=generateDates();if(curDateOffset>0)curDateOffset--;refreshUI()}};
  tick();setInterval(tick,1000)
}

lastMskDateStr=getDateKey(moscowNow());initFirebase();refreshUI();startMskClock();
</script>
