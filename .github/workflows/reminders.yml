name: Напоминания о занятиях

on:
  schedule:
            - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node reminders.js
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
